<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImgGen Prompt</title>
  <style>
    :root{
      --bg:#0b0f19;
      --text:#e7eefc;
      --muted:#a8b3cf;
      --accent:#5dd6ff;
      --danger:#ff5d7a;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(93,214,255,.18), transparent 50%),
                  radial-gradient(900px 500px at 100% 20%, rgba(61,255,181,.10), transparent 55%),
                  var(--bg);
      color:var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card{
      width:min(920px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .header{
      padding:18px 18px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      background: linear-gradient(180deg, rgba(93,214,255,.08), transparent);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .title h1{margin:0;font-size:16px}
    .title p{margin:0;color:var(--muted);font-size:12px}
    .body{padding:18px;display:grid;grid-template-columns:1fr;gap:14px}
    .row{display:flex;gap:10px;align-items:center}
    input[type="text"]{
      width:100%;
      padding:12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(10,14,24,.65);
      color: var(--text);
      outline:none;
    }
    input[type="text"]:focus{
      border-color: rgba(93,214,255,.45);
      box-shadow: 0 0 0 3px rgba(93,214,255,.12)
    }
    button{
      padding:12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(93,214,255,.25), rgba(93,214,255,.08));
      color: var(--text);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    button:disabled{opacity:.55; cursor:not-allowed}
    .status{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 12px;
      border-radius: 14px;
      background: rgba(18,26,43,.65);
      border: 1px solid rgba(255,255,255,.06);
    }
    .status .left{display:flex; align-items:center; gap:10px; min-width:0}
    .pill{
      font-size:12px;
      padding:4px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      flex:0 0 auto;
    }
    .msg{color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .spinner{
      width:18px; height:18px;
      border-radius:999px;
      border: 2px solid rgba(93,214,255,.25);
      border-top-color: rgba(93,214,255,.95);
      animation: spin .8s linear infinite;
      display:none;
      flex:0 0 auto;
    }
    .loading .spinner{display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .preview{
      display:grid;
      place-items:center;
      padding:14px;
      border-radius: 18px;
      background: rgba(15,22,38,.65);
      border: 1px solid rgba(255,255,255,.06);
      min-height: 240px;
      overflow:hidden;
    }
    .preview img{
      max-width:100%;
      max-height:560px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      display:none;
    }
    .placeholder{
      text-align:center;
      color: var(--muted);
      font-size:13px;
      padding:20px;
    }
    .error{
      color: #ffd2da;
      background: rgba(255,93,122,.10);
      border: 1px solid rgba(255,93,122,.22);
      padding:10px 12px;
      border-radius: 14px;
      font-size:12px;
      display:none;
      white-space:pre-wrap;
    }
    .meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .meta a{color: var(--accent);text-decoration:none;border-bottom:1px dotted rgba(93,214,255,.45)}
    footer{padding:0 18px 16px;color: rgba(168,179,207,.75);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    @media (min-width: 860px){
      .body{grid-template-columns: 420px 1fr; align-items:start}
      .preview{min-height: 360px}
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="header">
      <div class="title">
        <h1>ImgGen Prompt</h1>
        <p>Polls until JSON is real, then waits until the image is actually loaded. Because browsers are dramatic. 😅</p>
      </div>
    </div>

    <div class="body">
      <div>
        <div class="row">
          <input id="prompt" type="text" placeholder="Describe what you want…" autocomplete="off" />
          <button id="sendBtn" type="button">
            <span>Send</span><span aria-hidden="true">🚀</span>
          </button>
        </div>

        <div class="status">
          <div class="left">
            <div class="spinner" aria-label="Loading"></div>
            <span class="pill" id="pill">Idle</span>
            <div class="msg" id="msg">Waiting for your prompt.</div>
          </div>
          <div class="meta" id="meta"></div>
        </div>

        <div class="error" id="error"></div>
      </div>

      <div class="preview">
        <div class="placeholder" id="placeholder">Your image will show up here. Eventually. 🧠✨</div>
        <img id="resultImg" alt="Generated result" />
      </div>
    </div>

    <footer>
      <div>Endpoint: <code>https://imggen.ct.ws/gen.php?prompt=...</code></div>
      <div>Image base: <code>https://imggen.ct.ws/</code></div>
    </footer>
  </div>

  <script>
    const API_BASE = 'https://imggen.ct.ws';
    const GEN_URL = `${API_BASE}/gen.php?prompt=`;

    // Poll settings (tweak if you want)
    const POLL_INTERVAL_MS = 1200;   // how often to retry
    const MAX_WAIT_MS = 120000;      // total time before giving up (2 minutes)

    const app = document.getElementById('app');
    const input = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const pill = document.getElementById('pill');
    const msg = document.getElementById('msg');
    const meta = document.getElementById('meta');
    const errorBox = document.getElementById('error');
    const placeholder = document.getElementById('placeholder');
    const img = document.getElementById('resultImg');

    let currentAbort = null;

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    function setLoading(isLoading, label, message){
      app.classList.toggle('loading', isLoading);
      sendBtn.disabled = isLoading;
      input.disabled = isLoading;
      pill.textContent = label;
      msg.textContent = message;
    }

    function clearError(){
      errorBox.style.display = 'none';
      errorBox.textContent = '';
    }

    function showError(text){
      errorBox.textContent = text;
      errorBox.style.display = 'block';
    }

    function setMeta(links = []){
      meta.innerHTML = '';
      links.forEach(({label, href}) => {
        const a = document.createElement('a');
        a.textContent = label;
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        meta.appendChild(a);
      });
    }

    function resetPreview(){
      img.style.display = 'none';
      img.removeAttribute('src');
      placeholder.style.display = 'block';
    }

    async function fetchJsonEventually(url, signal){
      const started = Date.now();
      let lastText = '';

      while (Date.now() - started < MAX_WAIT_MS){
        // If aborted, throw AbortError-like behavior
        if (signal?.aborted) {
          const e = new Error('Aborted');
          e.name = 'AbortError';
          throw e;
        }

        let res;
        try {
          res = await fetch(url, { method: 'GET', signal, cache: 'no-store' });
        } catch (e) {
          // network / CORS / blocked requests show up here as TypeError in browsers
          throw new Error(
            'Request failed (network/CORS). If you opened this as file://, try serving it via a local server.'
          );
        }

        // Read as text first so we can retry if it's not JSON
        lastText = await res.text();

        // Try parse JSON
        try {
          const data = JSON.parse(lastText);

          // If API says success, we're done
          if (data && data.success === true && data.path) return data;

          // If API returns JSON but not ready, keep polling
        } catch {
          // Not JSON yet: keep polling
        }

        setLoading(true, 'Waiting', 'Server still cooking… retrying soon. 🍳');
        await sleep(POLL_INTERVAL_MS);
      }

      // Timed out: show the last response for debugging
      throw new Error(
        'Timed out waiting for valid JSON from the API.\n\nLast response was:\n' +
        (lastText ? lastText.slice(0, 500) : '[empty]')
      );
    }

    async function loadImage(url){
      setLoading(true, 'Loading', 'Downloading image...');
      await new Promise((resolve, reject) => {
        const cleanup = () => { img.onload = null; img.onerror = null; };
        img.onload = () => { cleanup(); resolve(); };
        img.onerror = () => { cleanup(); reject(new Error('Image failed to load.')); };

        // cache-bust
        const bust = `cb=${Date.now()}`;
        img.src = url + (url.includes('?') ? '&' : '?') + bust;
      });
    }

    async function generate(){
      const prompt = input.value.trim();
      if(!prompt){
        showError("Type something first. This isn't telepathy.");
        return;
      }

      // cancel old
      if (currentAbort) currentAbort.abort();
      currentAbort = new AbortController();

      clearError();
      setMeta([]);
      resetPreview();

      setLoading(true, 'Requesting', 'Sending prompt to the API...');

      try{
        const url = GEN_URL + encodeURIComponent(prompt);

        // Poll until we actually get valid, successful JSON
        const data = await fetchJsonEventually(url, currentAbort.signal);

        const imageUrl = `${API_BASE}/${String(data.path).replace(/^\/+/, '')}`;
        setMeta([{ label: 'Open image', href: imageUrl }]);

        // Wait until image fully loads before stopping spinner
        await loadImage(imageUrl);

        placeholder.style.display = 'none';
        img.style.display = 'block';

        setLoading(false, 'Done', 'Image loaded.');
      }catch(err){
        if (err?.name === 'AbortError') return;
        setLoading(false, 'Error', 'Something went wrong.');
        showError(err?.message || String(err));
      }finally{
        currentAbort = null;
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', generate);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){ e.preventDefault(); generate(); }
    });

    input.focus();
  </script>
</body>
</html>
